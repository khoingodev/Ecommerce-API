spring.application.name=ecommerce-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.seed-admin.enabled=${SEED_ADMIN_ENABLED:false}
app.seed-admin.email=${SEED_ADMIN_EMAIL:}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:}

app.jwt.secret=${JWT_SECRET:change-this-secret-to-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
