spring.application.name=ecommerce-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.security.user.name=${APP_USERNAME:admin}
spring.security.user.password=${APP_PASSWORD:change-me}
spring.security.user.roles=ADMIN
